name: yks_tercih_robotu
description: 2026 YKS için Türkçe karar destek uygulaması.
publish_to: none
version: 1.3.8+27
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0+1
  intl: ^0.20.2
  file_saver: ^0.4.0
  file_picker: ^11.0.2
  shared_preferences: ^2.5.5
  printing: ^5.14.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app-icon.png
  adaptive_icon_background: "#FFF7ED"
  adaptive_icon_foreground: assets/branding/app-icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/branding/app-icon.png
    background_color: "#FFF9F4"
    theme_color: "#8174C9"
